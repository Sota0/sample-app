<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルーレットアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎰 ルーレットアプリ</h1>
            <div class="header-controls">
                <button id="darkModeToggle" class="icon-btn" aria-label="ダークモード切替">🌙</button>
            </div>
        </header>

        <main>
            <!-- Mode Selection -->
            <section class="mode-section">
                <div class="mode-toggle">
                    <button id="singleMode" class="mode-btn active">単独モード</button>
                    <button id="pairingMode" class="mode-btn">ペアリングモード</button>
                </div>
            </section>

            <!-- Lists Section -->
            <section class="lists-section">
                <div class="list-container">
                    <div class="list-panel">
                        <div class="list-header">
                            <h2>参加者</h2>
                            <div class="list-controls">
                                <button id="addParticipant" class="btn-sm">追加</button>
                                <button id="resetParticipants" class="btn-sm btn-secondary">リセット</button>
                            </div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="participantInput" placeholder="参加者名を入力">
                        </div>
                        <ul id="participantList" class="item-list"></ul>
                    </div>

                    <div class="list-panel" id="penaltyPanel">
                        <div class="list-header">
                            <h2>ペナルティ</h2>
                            <div class="list-controls">
                                <button id="addPenalty" class="btn-sm">追加</button>
                                <button id="resetPenalties" class="btn-sm btn-secondary">リセット</button>
                            </div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="penaltyInput" placeholder="ペナルティを入力">
                        </div>
                        <ul id="penaltyList" class="item-list"></ul>
                    </div>
                </div>
            </section>

            <!-- Roulette Section -->
            <section class="roulette-section">
                <div class="canvas-container">
                    <canvas id="rouletteCanvas" width="400" height="400"></canvas>
                    <div id="result" class="result-display"></div>
                </div>
                <button id="spinBtn" class="spin-btn">スピン!</button>
            </section>

            <!-- Options Section -->
            <section class="options-section">
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="noRepeatMode">
                        <span>選択後に削除（リピートなし）</span>
                    </label>
                </div>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <div class="history-header">
                    <h2>履歴</h2>
                    <div class="history-controls">
                        <button id="undoBtn" class="btn-sm">元に戻す</button>
                        <button id="clearHistoryBtn" class="btn-sm btn-secondary">クリア</button>
                    </div>
                </div>
                <ul id="historyList" class="history-list"></ul>
            </section>
        </main>
    </div>

    <!-- Confetti Container -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Admin Panel (Hidden) -->
    <div id="adminPanel" class="admin-modal" role="dialog" aria-labelledby="adminTitle" aria-hidden="true">
        <div class="admin-overlay"></div>
        <div class="admin-content">
            <h2 id="adminTitle">🔐 管理者パネル</h2>
            
            <!-- Passcode Entry -->
            <div id="passcodeSection" class="admin-section">
                <label for="passcodeInput">パスコードを入力:</label>
                <input type="password" id="passcodeInput" placeholder="4桁のパスコード" maxlength="4" pattern="[0-9]{4}">
                <button id="passcodeSubmit" class="btn-sm">確認</button>
                <p id="passcodeError" class="error-message"></p>
            </div>

            <!-- Admin Controls (Hidden until passcode verified) -->
            <div id="adminControls" class="admin-section" style="display: none;">
                <div class="admin-field">
                    <label for="nextWinner">次の勝者:</label>
                    <input type="text" id="nextWinner" list="participantSuggestions" placeholder="参加者名（部分一致可）" autocomplete="off">
                    <datalist id="participantSuggestions"></datalist>
                </div>

                <div class="admin-field">
                    <label for="applyCount">適用回数:</label>
                    <input type="number" id="applyCount" value="1" min="1" max="99">
                </div>

                <div class="admin-field">
                    <label for="animationStyle">アニメーション:</label>
                    <select id="animationStyle">
                        <option value="wheel">ホイール</option>
                        <option value="tvscroll">TVスクロール</option>
                    </select>
                </div>

                <div class="admin-field">
                    <label>
                        <input type="checkbox" id="showDecoyOdds">
                        <span>デコイ確率表示（見た目のみ）</span>
                    </label>
                </div>

                <div class="admin-buttons">
                    <button id="setRig" class="btn-sm">設定</button>
                    <button id="clearRig" class="btn-sm btn-secondary">クリア</button>
                    <button id="closeAdmin" class="btn-sm btn-secondary">閉じる</button>
                </div>

                <div id="rigStatus" class="rig-status"></div>
            </div>
        </div>
    </div>

    <!-- TV Scroll Container -->
    <div id="tvScrollContainer" class="tv-scroll-container" style="display: none;">
        <div class="tv-scroll-window">
            <div id="tvScrollList" class="tv-scroll-list"></div>
            <div class="tv-scroll-highlight"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
